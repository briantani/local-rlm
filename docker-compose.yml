services:
  rlm-web:
    build: .
    image: local-rlm:latest
    container_name: local-rlm
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Live source code (development - no rebuild needed for code changes)
      - ./src:/app/src
      # Persistent runs/artifacts
      - ./runs:/app/runs
      # Persistent logs
      - ./logs:/app/logs
      # Persistent workspaces for session files
      - ./workspaces:/app/workspaces
      # Persistent DSPy cache
      - ./.dspy_cache:/app/.dspy_cache
      # Persistent DB/data directory
      - ./data:/app/data
      # Mount configs if you want to edit them live
      - ./configs:/app/configs:ro
    environment:
      # Set your API keys here or use a .env file
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Configure logging level
      - LOG_LEVEL=INFO
    # Development mode: mount source and auto-reload on changes
    entrypoint: python -m uvicorn src.web.app:app --host 0.0.0.0 --port 8000 --reload
    extra_hosts:
      # Allow access to host machine's Ollama if running locally
      - "host.docker.internal:host-gateway"

    # Healthcheck to ensure service is up
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  rlm-frontend:
    image: node:20
    container_name: local-rlm-frontend
    working_dir: /app/frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
    command: npm run dev -- --host 0.0.0.0
